name: Cliper Automatico

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link de YouTube (ARZ Urus, Marc Verdu, etc.)'
        required: true
        type: string
      cantidad:
        description: 'Cuantos clips sacar (recomendado: 4)'
        required: true
        default: '4'
        type: string
      estilo:
        description: 'Estilo de subtitulos'
        required: true
        default: 'bold_yellow'
        type: choice
        options:
          - bold_yellow
          - neon_pop
          - clean_white
      modelo:
        description: 'Calidad de subtitulos (small = mejor espanol, base = mas rapido)'
        required: true
        default: 'small'
        type: choice
        options:
          - small
          - base
          - tiny

jobs:
  clipear:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar FFmpeg y fuentes profesionales
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-bebas-neue fontconfig
          fc-cache -fv

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Deno para yt-dlp
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Activar Cloudflare WARP opcional
        run: |
          (
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg &&
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo $VERSION_CODENAME) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list &&
            sudo apt-get update &&
            sudo apt-get install -y cloudflare-warp &&
            warp-cli --accept-tos registration new &&
            warp-cli --accept-tos mode proxy &&
            warp-cli --accept-tos connect &&
            sleep 4 &&
            curl -s --max-time 8 -x http://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on" &&
            echo "WARP_PROXY=http://127.0.0.1:40000" >> "$GITHUB_ENV" &&
            echo "WARP activo"
          ) || echo "Continuando sin WARP"

      - name: Descargar AI Agent Cut y yt-dlp actualizado
        run: |
          git clone --depth 1 https://github.com/wisdomdaniel5544-ops/ai-agent-cut.git
          cd ai-agent-cut
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]"

      - name: Descargar video de YouTube (<=720p)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$YT_COOKIES" ]; then
            printf "%s\n" "$YT_COOKIES" > cookies.txt
            EXTRA_ARGS+=(--cookies cookies.txt)
            echo "Usando cookies de YT_COOKIES"
          else
            echo "AVISO: No se encontro el secreto YT_COOKIES"
          fi
          if [ -n "$WARP_PROXY" ]; then
            EXTRA_ARGS+=(--proxy "$WARP_PROXY")
          fi
          if ! yt-dlp "${EXTRA_ARGS[@]}" --no-playlist -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best[height<=720]/best" --merge-output-format mp4 -o video.mp4 "${{ inputs.url }}"; then
            echo "Primer intento fallo; reintentando sin proxy WARP..."
            RETRY_ARGS=()
            if [ -f cookies.txt ]; then
              RETRY_ARGS+=(--cookies cookies.txt)
            fi
            yt-dlp "${RETRY_ARGS[@]}" --no-playlist -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best[height<=720]/best" --merge-output-format mp4 -o video.mp4 "${{ inputs.url }}"
          fi

      - name: Crear clips virales
        run: |
          cd ai-agent-cut
          if python -m aiagentcut --help | grep -q -- "--lang"; then
            python -m aiagentcut ../video.mp4 -o ../output -n "${{ inputs.cantidad }}" -p "${{ inputs.estilo }}" -m "${{ inputs.modelo }}" --lang es
          else
            python -m aiagentcut ../video.mp4 -o ../output -n "${{ inputs.cantidad }}" -p "${{ inputs.estilo }}" -m "${{ inputs.modelo }}"
          fi

      - name: Empaquetar solo los clips finales
        uses: actions/upload-artifact@v7
        with:
          name: clips-listos
          path: |
            output/clip_*.mp4
            output/report.json
          retention-days: 1
          if-no-files-found: error
