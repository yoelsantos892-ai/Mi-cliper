name: Cliper Pro Elegante

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Link de YouTube (Marc Verdu, ARZ Urus, podcast)'
        required: true
        type: string
      creador:
        description: 'A quien estas clipeando (ajusta titulos y hashtags)'
        required: true
        default: 'marc_verdu'
        type: choice
        options:
          - marc_verdu
          - arz_urus
          - ambos
      modo_camara:
        description: 'Como se grabo el video'
        required: true
        default: '1_persona'
        type: choice
        options:
          - 1_persona
          - 2_personas_pantalla_partida
          - plano_completo_elegante
      usar_broll:
        description: 'Meter B-Roll inteligente por contexto (pon NO si ya sale con coches/viajes)'
        required: true
        default: 'no'
        type: choice
        options:
          - no
          - si
      usar_musica:
        description: 'Musica Dark Ambient sutil + audio de estudio'
        required: true
        default: 'si'
        type: choice
        options:
          - si
          - no
      enfoque:
        description: 'Tema opcional a buscar (ej: dinero, shopify, china) o dejar vacio'
        required: false
        default: ''
        type: string
      cantidad:
        description: 'Cuantos clips sacar'
        required: true
        default: '4'
        type: string
      duracion_max:
        description: 'Duracion maxima en segundos (45=rapido, 68=largo >1min TikTok)'
        required: true
        default: '45'
        type: choice
        options:
          - '35'
          - '45'
          - '68'
      estilo:
        description: 'Estilo visual (clean_white = mas elegante y limpio)'
        required: true
        default: 'clean_white'
        type: choice
        options:
          - clean_white
          - bold_yellow
      modelo:
        description: 'Precision en espanol (small = mejor, base = mas rapido)'
        required: true
        default: 'small'
        type: choice
        options:
          - small
          - base
      url_musica:
        description: 'Link opcional de musica propia sin copyright (dejar vacio = Dark Ambient)'
        required: false
        default: ''
        type: string

jobs:
  clipear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v6

      - name: Cachear modelos y musica
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/micliper_music
          key: micliper-${{ runner.os }}-${{ inputs.modelo }}-v1
          restore-keys: |
            micliper-${{ runner.os }}-

      - name: Instalar FFmpeg y fuentes elegantes
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o ~/.local/share/fonts/Montserrat-Bold.ttf "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-Bold.ttf" || true
          fc-cache -f ~/.local/share/fonts || true

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar Deno para yt-dlp
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Activar Cloudflare WARP opcional
        run: |
          (
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg &&
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo $VERSION_CODENAME) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list &&
            sudo apt-get update &&
            sudo apt-get install -y cloudflare-warp &&
            warp-cli --accept-tos registration new &&
            warp-cli --accept-tos mode proxy &&
            warp-cli --accept-tos connect &&
            sleep 4 &&
            curl -s --max-time 8 -x http://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on" &&
            echo "WARP_PROXY=http://127.0.0.1:40000" >> "$GITHUB_ENV" &&
            echo "WARP activo"
          ) || echo "Continuando sin WARP"

      - name: Instalar motor AI Agent Cut y yt-dlp
        run: |
          git clone --depth 1 https://github.com/wisdomdaniel5544-ops/ai-agent-cut.git
          cd ai-agent-cut
          pip install -r requirements.txt
          pip install -U "yt-dlp[default]"

      - name: Descargar video de YouTube (<=720p)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$YT_COOKIES" ]; then
            printf "%s\n" "$YT_COOKIES" > cookies.txt
            EXTRA_ARGS+=(--cookies cookies.txt)
            echo "Usando cookies de YT_COOKIES"
          fi
          if [ -n "$WARP_PROXY" ]; then
            EXTRA_ARGS+=(--proxy "$WARP_PROXY")
          fi
          if ! yt-dlp "${EXTRA_ARGS[@]}" --no-playlist -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best[height<=720]/best" --merge-output-format mp4 -o video.mp4 "${{ inputs.url }}"; then
            RETRY_ARGS=()
            if [ -f cookies.txt ]; then
              RETRY_ARGS+=(--cookies cookies.txt)
            fi
            yt-dlp "${RETRY_ARGS[@]}" --no-playlist -f "bestvideo[height<=720][ext=mp4]+bestaudio[ext=m4a]/best[height<=720][ext=mp4]/best[height<=720]/best" --merge-output-format mp4 -o video.mp4 "${{ inputs.url }}"
          fi

      - name: Preparar encuadre de camara
        run: |
          if [ "${{ inputs.modo_camara }}" = "2_personas_pantalla_partida" ]; then
            echo "Partiendo pantalla arriba/abajo para 2 personas..."
            python pro_clipper.py pre-split --input video.mp4 --output video_ready.mp4
          else
            mv video.mp4 video_ready.mp4
          fi

      - name: Generar base de clips
        run: |
          ARGS=(
            ../video_ready.mp4
            -o ../output
            -n "${{ inputs.cantidad }}"
            -p "${{ inputs.estilo }}"
            -m "${{ inputs.modelo }}"
            --max "${{ inputs.duracion_max }}"
          )
          if [ "${{ inputs.duracion_max }}" = "68" ]; then
            ARGS+=(--min 60)
          else
            ARGS+=(--min 20)
          fi
          cd ai-agent-cut
          HELP_TXT="$(python -m aiagentcut --help)"
          if echo "$HELP_TXT" | grep -q -- "--lang"; then
            ARGS+=(--lang es)
          fi
          if [ -n "${{ inputs.enfoque }}" ] && echo "$HELP_TXT" | grep -q -- "--prompt"; then
            ARGS+=(--prompt "${{ inputs.enfoque }}")
          fi
          if [ "${{ inputs.modo_camara }}" = "plano_completo_elegante" ] && echo "$HELP_TXT" | grep -q -- "--fit"; then
            ARGS+=(--fit blur)
          fi
          python -m aiagentcut "${ARGS[@]}"

      - name: Pulir estilo elegante, B-Roll inteligente y textos virales
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python pro_clipper.py post \
            --creador "${{ inputs.creador }}" \
            --broll "${{ inputs.usar_broll }}" \
            --musica "${{ inputs.usar_musica }}" \
            --url-musica "${{ inputs.url_musica }}" \
            --modelo "${{ inputs.modelo }}"

      - name: Empaquetar clips enumerados y guia de publicacion
        uses: actions/upload-artifact@v7
        with:
          name: clips-listos
          path: final_output/*
          retention-days: 1
          if-no-files-found: error
